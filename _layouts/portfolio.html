<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'pt-BR' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{{ page.title | default: site.title | escape }}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}">
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts for Portfolio -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,300&family=Roboto+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Portfolio-specific CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
    
    <!-- SEO Plugin -->
    {% seo %}
    
    <!-- Additional SEO and Social Media -->
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="{{ site.title | escape }}">
    <meta property="og:locale" content="pt_BR">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
    <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
    
    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#97BF5C">
    <meta name="msapplication-TileColor" content="#1C1F24">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  </head>
  <body>
    <a href="#content" class="sr-only sr-only-focusable">Pular para o conteúdo</a>
    
    {{ content }}
    
    <!-- Portfolio-specific JavaScript -->
    <script src="{{ '/assets/js/portfolio.js' | relative_url }}"></script>
  </body>
</html>
