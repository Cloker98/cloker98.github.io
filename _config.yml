# Site settings
title: "Elizeu Neto - Links"
description: "Links to Elizeu Neto's projects and content"
author: "Elizeu Neto"
baseurl: ""
url: "https://cloker98.github.io"

# SEO settings
lang: en
timezone: America/Sao_Paulo

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
encoding: utf-8

# Jekyll plugins
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# Plugin settings
feed:
  excerpt_only: true

# Exclude files from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .bundle
  - .git
  - .gitignore

# Include files
include:
  - _pages

# Collections
collections:
  layouts:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      
# Sass settings
sass:
  style: compressed
  sass_dir: _sass

# Compression
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false